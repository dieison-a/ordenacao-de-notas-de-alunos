<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notas de Programação Web II</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <main class="card">
        <h1>Primeira avaliação de Programação Web II</h1>

        <form action="mostraAlunos.php" method="post">
            <label for="nome1">Nome do aluno 1:</label>
            <input type="text" name="nome1" id="nome1" required />
            <label for="nota1">Nota do aluno 1:</label>
            <input type="number" name="nota1" id="nota1" min="0" max="10" step="0.01" required />

            <label for="nome2">Nome do aluno 2:</label>
            <input type="text" name="nome2" id="nome2" required />
            <label for="nota2">Nota do aluno 2:</label>
            <input type="number" name="nota2" id="nota2" min="0" max="10" step="0.01" required />

            <label for="nome3">Nome do aluno 3:</label>
            <input type="text" name="nome3" id="nome3" required />
            <label for="nota3">Nota do aluno 3:</label>
            <input type="number" name="nota3" id="nota3" min="0" max="10" step="0.01" required />

            <button type="submit">Cadastrar alunos</button>
            <button type="reset">Limpar</button>
        </form>
    </main>
</body>

</html>
